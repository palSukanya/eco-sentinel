<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2b1a"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e5f8e"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M16 5 L23 8 L23 17 C23 22 20 25 16 27 C12 25 9 22 9 17 L9 8 Z"
        fill="url(#sh)" opacity="0.95"/>

  <!-- Wave inside shield -->
  <path d="M11 18 Q13.5 15 16 18 Q18.5 21 21 18"
        stroke="#14b8a6" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Second smaller wave -->
  <path d="M11 20.5 Q13.5 17.5 16 20.5 Q18.5 23.5 21 20.5"
        stroke="#14b8a6" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- White circle checkmark at top of shield -->
  <circle cx="16" cy="12" r="2.5" fill="white" opacity="0.92"/>
  <path d="M14.8 12 L15.7 13 L17.5 10.5"
        stroke="#0a1628" stroke-width="1" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
